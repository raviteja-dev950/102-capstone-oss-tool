spring.application.name=102-capstone-oss-tool
server.port=${PORT\:8104}
spring.datasource.url=jdbc\:h2\:mem\:ossdb\n
spring.datasource.username=sa\n
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update\n
spring.jpa.show-sql=false\n
spring.h2.console.enabled=true\n
spring.h2.console.path=/h2-console\n
spring.h2.console.settings.web-allow-others=true
spring.cache.type=caffeine\n
spring.cache.caffeine.spec=maximumSize\=1000,expireAfterWrite\=600s,recordStats
